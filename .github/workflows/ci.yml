name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm run test:unit

      - name: Production build
        run: npm run build
        env:
          CI: "true"

  smoke:
    name: browser smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        # No --with-deps: it runs apt-get, which hung on the runner. ubuntu-latest
        # already ships the shared libraries Chromium needs.
        timeout-minutes: 8
        run: npx playwright install chromium

      - name: Start app (dev server on :8080)
        run: |
          npm run dev > "$RUNNER_TEMP/dev.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null -m 5 http://127.0.0.1:8080/; then
              echo "app is up after ${i} checks"
              exit 0
            fi
            sleep 2
          done
          echo "app did not start"
          cat "$RUNNER_TEMP/dev.log"
          exit 1

      - name: Smoke suite
        env:
          SMOKE_OUT_DIR: ${{ runner.temp }}/smoke
        run: npm run test:smoke

      - name: Upload screenshots and dev log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/smoke
            ${{ runner.temp }}/dev.log
          if-no-files-found: ignore
          retention-days: 7
